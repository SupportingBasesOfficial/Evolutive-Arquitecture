name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Require tag to match VERSION
        shell: bash
        run: |
          version="$(cat VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Test and validate
        run: |
          python -m unittest discover --start-directory tests
          python scripts/validate_rules.py

      - name: Build immutable bundle
        run: python scripts/build_bundle.py --version "$(cat VERSION)" --output-dir dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
