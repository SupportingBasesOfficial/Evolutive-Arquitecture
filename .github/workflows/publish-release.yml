name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to publish (without v)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Require requested version to match VERSION
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: test "$REQUESTED_VERSION" = "$(cat VERSION)"

      - name: Refuse an existing tag or release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          ! git ls-remote --exit-code --tags origin "refs/tags/v$REQUESTED_VERSION"
          ! gh release view "v$REQUESTED_VERSION"

      - name: Test and validate
        run: |
          python -m unittest discover --start-directory tests
          python scripts/validate_rules.py

      - name: Build immutable bundle
        run: python scripts/build_bundle.py --version "${{ inputs.version }}" --output-dir dist

      - name: Publish tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ inputs.version }}" dist/*
          --target "$GITHUB_SHA"
          --title "v${{ inputs.version }}"
          --generate-notes
