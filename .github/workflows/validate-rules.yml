name: Validate rules

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Test tooling boundaries and bundle reproducibility
        run: python -m unittest discover --start-directory tests

      - name: Validate the canonical catalog
        run: python scripts/validate_rules.py

      - name: Validate the consumer configuration template
        run: python scripts/validate_project_config.py

      - name: Build release candidate
        run: python scripts/build_bundle.py --version "$(cat VERSION)" --output-dir dist
