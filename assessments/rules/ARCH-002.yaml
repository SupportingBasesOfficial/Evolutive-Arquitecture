assessment_version: 1
rule_id: ARCH-002
assessed_status: experimental
target_status: active
verdict: not_ready
criteria:
  scope_is_observable: true
  compliance_is_observable: true
  evidence_collection_plan_exists: true
  enforcement_matches_declared_level: false
  exception_governance_ready: true
enforcement:
  declared_level: semiautomatic
  mechanism_available: false
  checker_outcomes: fail_only
  gaps:
    - Rule semantic coverage torna explícitas as classes de dependência conhecidas da regra; source_module_dependency pode ser covered quando Python/ECMAScript possuem coverage sufficient, mas construction_selection, inheritance/call, dynamic runtime resolution, configuration binding, data contracts, FFI e interprocess dependency permanecem sem capability completa.
    - Build-time provenance agora representa macros, generated source, transforms, build graph e linker binding com artefatos hash-bound e mapping semântico parcial, mas ainda não existem provenance producers confiáveis por ecossistema nem autoridade que promova candidate_relations para relações semanticamente comprovadas.
    - A governança de exaustividade define decisão auditável, snapshot semântico e busca adversarial obrigatória, mas a taxonomia e o profile de ARCH-002 permanecem not_established e não existe decisão approved para o snapshot atual; o evaluator v0.1.0 continua estruturalmente proibido de afirmar complete_rule_semantics.
    - Adapters continuam limitados a Python e ECMAScript/TypeScript sem JSX; superfícies conhecidas sem adapter, arquivos unclassified e coverage/alignment incompletos permanecem blockers explícitos.
    - O resultado agregado/semantic coverage ainda não está integrado ao comando/relatório final de adoção como mecanismo semiautomático disponível para enforcement.
    - A classificação da direção permitida entre políticas continua sendo autoridade arquitetural explícita do consumidor, não inferência do adapter.
evidence:
  - kind: rule_contract
    reference: rules/universal/ARCH-002.yaml
    summary: A regra define direção observável de dependências e condições concretas de falha entre fronteiras.
  - kind: checker
    reference: evolutive/checkers/architecture.py
    summary: O checker 0.2.0 detecta como fail dependências entre componentes que contrariem may_depend_on no grafo validado e permanece fail_only.
  - kind: governance
    reference: schema/architecture-evidence.schema.json
    summary: O contrato portável representa componentes, direção permitida, dependências observadas e vínculos de snapshot sem depender de sintaxe de linguagem.
  - kind: governance
    reference: schema/coverage-attestation.schema.json
    summary: O contrato de coverage separa suficiência individual de observação de resultado de regra e vincula evidence, snapshot, adapter e attestor por digests.
  - kind: governance
    reference: schema/coverage-composition.schema.json
    summary: A composição exige todas as observações declaradas pela observation policy no mesmo inventário e mantém complete separado de outcome de regra.
  - kind: governance
    reference: governance/ecosystem-catalog.yaml
    summary: O catálogo governado classifica superfícies de código conhecidas e distingue adapters disponíveis de superfícies reconhecidas ainda sem cobertura.
  - kind: governance
    reference: schema/observation-alignment.schema.json
    summary: O alignment vincula snapshot, catálogo e observation policy e mantém aligned restrito ao escopo classificatório governado.
  - kind: governance
    reference: governance/positive-result-policy.yaml
    summary: A positive result policy autoriza evidência positiva de ARCH-002 apenas para observed_dependency_graph e declara complete_rule_semantics false.
  - kind: governance
    reference: governance/semantic-relation-taxonomy.yaml
    summary: A taxonomia torna explícitas classes conhecidas de dependência e declara sua própria exaustividade como not_established.
  - kind: governance
    reference: governance/rule-semantic-profiles.yaml
    summary: O profile de ARCH-002 vincula relações semanticamente relevantes ao contrato normativo atual por SHA-256 e permanece não exaustivo.
  - kind: governance
    reference: governance/semantic-observation-capabilities.yaml
    summary: Os adapters atuais declaram capability completa apenas para source_module_dependency quando sua coverage é sufficient.
  - kind: governance
    reference: governance/build-time-provenance-taxonomy.yaml
    summary: A provenance taxonomy separa source, macro, generated source, transforms, build graph, linker e packaging sem poder criar semântica de regra.
  - kind: governance
    reference: governance/build-time-semantic-mapping.yaml
    summary: O mapping liga provenance classes apenas a candidate_relations existentes e permanece estruturalmente partial.
  - kind: governance
    reference: schema/build-time-provenance-evidence.schema.json
    summary: O evidence contract vincula inputs e outputs por SHA-256 e não possui autoridade para afirmar relação semântica comprovada ou rule outcome.
  - kind: governance
    reference: schema/rule-semantic-coverage.schema.json
    summary: O resultado v1 fixa complete_rule_semantics false e expõe relations covered/partial/uncovered sem rule-pass.
  - kind: governance
    reference: schema/semantic-exhaustiveness-decision.schema.json
    summary: Uma futura declaração established exige decisão vinculada ao snapshot semântico exato, revisão multidimensional, busca adversarial, evidências e zero gaps unresolved.
  - kind: governance
    reference: scripts/validate_semantic_exhaustiveness_governance.py
    summary: O gate recusa decisões approved incompletas, referências inconsistentes e aprovações dormentes para o snapshot semântico atual.
  - kind: test
    reference: tests/test_ecosystem_adapter.py
    summary: O adapter Python de referência demonstra geração brokerada de edges entre componentes com coverage e ambiguidades auditáveis.
  - kind: test
    reference: tests/test_ecmascript_adapter.py
    summary: O adapter ECMAScript de referência demonstra que o mesmo contrato suporta TypeScript/JavaScript com resolução relativa conservadora e incerteza explícita.
  - kind: test
    reference: tests/test_coverage_attestation.py
    summary: A attestation só aceita evidence reproduzível do snapshot atual e distingue coverage insuficiente de falha de integridade.
  - kind: test
    reference: tests/test_coverage_composition.py
    summary: Python e ECMAScript são compostos no mesmo inventário e qualquer observação obrigatória insufficient mantém a composição incomplete.
  - kind: test
    reference: tests/test_ecosystem_inventory_alignment.py
    summary: Discovery detecta Python/ECMAScript, omissions, superfícies sem adapter, arquivos unclassified e stale alignment sem produzir outcome de regra.
  - kind: test
    reference: tests/test_result_aggregation.py
    summary: O aggregator preserva fail e limita positive evidence ao grafo observado.
  - kind: test
    reference: tests/test_rule_semantic_coverage.py
    summary: Semantic coverage prova source_module_dependency coberta quando aplicável e preserva gaps explícitos para relações sem capability, taxonomy/profile não exaustivos, unclassified e coverage incompleta.
  - kind: test
    reference: tests/test_semantic_exhaustiveness_governance.py
    summary: Regressões comprovam digest de snapshot, caminho canônico, revisão obrigatória, contraexemplos, evidências independentes e vínculo de status.
  - kind: test
    reference: tests/test_build_time_provenance_governance.py
    summary: Regressões preservam separação provenance/semântica, mapping partial e ausência de authority para rule-pass.
  - kind: adoption
    reference: decisions/rules/ARCH-002/0.2.0-experimental-approved.yaml
    summary: A adoção permanece experimental enquanto complete_rule_semantics não for provado e o mecanismo não estiver integrado ao enforcement.
assessment:
  assessor: SupportingBasesOfficial
  assessed_at: "2026-09-03"
