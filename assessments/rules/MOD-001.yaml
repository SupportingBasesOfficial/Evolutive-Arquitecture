assessment_version: 1
rule_id: MOD-001
assessed_status: experimental
target_status: active
verdict: not_ready
criteria:
  scope_is_observable: true
  compliance_is_observable: true
  evidence_collection_plan_exists: true
  enforcement_matches_declared_level: false
  exception_governance_ready: true
enforcement:
  declared_level: semiautomatic
  mechanism_available: false
  checker_outcomes: fail_only
  gaps:
    - Rule semantic coverage torna explícitas as classes de interação conhecidas da regra; source_module_dependency pode ser covered quando Python/ECMAScript possuem coverage sufficient, mas inheritance/call, dynamic runtime resolution, configuration binding, data contracts, FFI, IPC e behavioral_convention_dependency permanecem sem capability completa.
    - Build-time provenance possui producers declarativo/observado confiáveis e agora existe uma autoridade positiva estritamente local para linker_binding -> ffi_native_linkage sob observation_basis observed + trust verified. O mapping geral continua partial; demais candidate_relations permanecem sem promoção semântica autorizada e essa evidência local não prova coverage completa nem outcome de regra.
    - A governança de exaustividade define decisão auditável, snapshot semântico e busca adversarial obrigatória, mas a taxonomia e o profile de MOD-001 permanecem not_established e não existe decisão approved para o snapshot atual; o evaluator v0.1.0 continua estruturalmente proibido de afirmar complete_rule_semantics.
    - Adapters continuam limitados a Python e ECMAScript/TypeScript sem JSX; superfícies conhecidas sem adapter, arquivos unclassified e coverage/alignment incompletos permanecem blockers explícitos.
    - O resultado agregado/semantic coverage ainda não está integrado ao comando/relatório final de adoção como mecanismo semiautomático disponível para enforcement.
    - Convenções públicas que não possam ser representadas por evidence estrutural continuam dependentes de mecanismo adicional de review/evidence antes de qualquer alegação semântica completa.
evidence:
  - kind: rule_contract
    reference: rules/universal/MOD-001.yaml
    summary: A regra define superfície pública observável, violações identificáveis e uma exceção limitada.
  - kind: checker
    reference: evolutive/checkers/architecture.py
    summary: O checker 0.2.0 detecta como fail dependências entre componentes cujo target_path não pertence à public_surface declarada e permanece fail_only.
  - kind: governance
    reference: schema/architecture-evidence.schema.json
    summary: O contrato portável representa componentes, superfícies públicas, dependências observadas e vínculos de snapshot sem depender de linguagem específica.
  - kind: governance
    reference: schema/coverage-attestation.schema.json
    summary: O contrato de coverage separa suficiência individual de observação de resultado de regra e vincula evidence, snapshot, adapter e attestor por digests.
  - kind: governance
    reference: schema/coverage-composition.schema.json
    summary: A composição exige todas as observações declaradas pela observation policy no mesmo inventário e mantém complete separado de outcome de regra.
  - kind: governance
    reference: governance/ecosystem-catalog.yaml
    summary: O catálogo governado classifica superfícies de código conhecidas e distingue adapters disponíveis de superfícies reconhecidas ainda sem cobertura.
  - kind: governance
    reference: schema/observation-alignment.schema.json
    summary: O alignment vincula snapshot, catálogo e observation policy e mantém aligned restrito ao escopo classificatório governado.
  - kind: governance
    reference: governance/positive-result-policy.yaml
    summary: A positive result policy autoriza evidência positiva de MOD-001 apenas para observed_dependency_graph e declara complete_rule_semantics false.
  - kind: governance
    reference: governance/semantic-relation-taxonomy.yaml
    summary: A taxonomia torna explícitas classes conhecidas de interação/dependência e declara sua própria exaustividade como not_established.
  - kind: governance
    reference: governance/rule-semantic-profiles.yaml
    summary: O profile de MOD-001 vincula relações semanticamente relevantes ao contrato normativo atual por SHA-256 e permanece não exaustivo.
  - kind: governance
    reference: governance/semantic-observation-capabilities.yaml
    summary: Os adapters atuais declaram capability completa apenas para source_module_dependency quando sua coverage é sufficient.
  - kind: governance
    reference: governance/build-time-provenance-taxonomy.yaml
    summary: A provenance taxonomy modela transformações derivadas sem poder criar semântica de regra.
  - kind: governance
    reference: governance/build-time-semantic-mapping.yaml
    summary: O mapping liga provenance classes apenas a candidate_relations existentes e permanece estruturalmente partial.
  - kind: governance
    reference: schema/build-time-provenance-evidence.schema.json
    summary: O evidence contract vincula inputs e outputs por SHA-256 e não possui authority para afirmar relação semântica comprovada ou rule outcome.
  - kind: governance
    reference: producers/declared-manifest-verifier.yaml
    summary: O producer declarativo possui capabilities fechadas e observation_basis declared.
  - kind: governance
    reference: producers/observed-manifest-reader.yaml
    summary: O producer observado lê somente build manifests brokerados e hash-bound, sem executar build ou código do consumidor, e mantém candidate_relations sem autoridade semântica.
  - kind: governance
    reference: schema/provenance-producer-trust-attestation.schema.json
    summary: A trust attestation v1 vincula input do producer, artifact scope, evidence, producer e attestor sem criar autoridade semântica ou normativa.
  - kind: governance
    reference: governance/provenance-semantic-interpretation-policy.yaml
    summary: A policy v1 autoriza somente linker_binding -> ffi_native_linkage sob provenance observada e trust verificado, com scope transformation_local.
  - kind: governance
    reference: schema/provenance-semantic-interpretation.schema.json
    summary: O resultado de interpretação vincula semantic relation proven aos inputs/outputs hash-bound da transformation e mantém rule outcome/complete semantics proibidos.
  - kind: governance
    reference: schema/rule-semantic-coverage.schema.json
    summary: O resultado v1 fixa complete_rule_semantics false e expõe relations covered/partial/uncovered sem rule-pass.
  - kind: governance
    reference: schema/semantic-exhaustiveness-decision.schema.json
    summary: Uma futura declaração established exige decisão vinculada ao snapshot semântico exato, revisão multidimensional, busca adversarial, evidências e zero gaps unresolved.
  - kind: governance
    reference: scripts/validate_semantic_exhaustiveness_governance.py
    summary: O gate recusa decisões approved incompletas, referências inconsistentes e aprovações dormentes para o snapshot semântico atual.
  - kind: test
    reference: tests/test_ecosystem_adapter.py
    summary: O adapter Python de referência demonstra observação brokerada de imports e preservação auditável de coverage antes do checker universal.
  - kind: test
    reference: tests/test_ecmascript_adapter.py
    summary: O adapter ECMAScript de referência demonstra observação brokerada de relações TypeScript/JavaScript sem mudar o significado da superfície pública universal.
  - kind: test
    reference: tests/test_coverage_attestation.py
    summary: A attestation só aceita evidence reproduzível do snapshot atual e mantém coverage insuficiente separada do resultado do checker.
  - kind: test
    reference: tests/test_coverage_composition.py
    summary: Python e ECMAScript são compostos no mesmo inventário e qualquer observação obrigatória insufficient mantém a composição incomplete.
  - kind: test
    reference: tests/test_ecosystem_inventory_alignment.py
    summary: Discovery detecta Python/ECMAScript, omissions, superfícies sem adapter, arquivos unclassified e stale alignment sem produzir outcome de regra.
  - kind: test
    reference: tests/test_result_aggregation.py
    summary: O aggregator preserva fail e limita positive evidence ao grafo observado.
  - kind: test
    reference: tests/test_rule_semantic_coverage.py
    summary: Semantic coverage prova source_module_dependency coberta quando aplicável e preserva gaps explícitos para relações sem capability, taxonomy/profile não exaustivos, unclassified e coverage incompleta.
  - kind: test
    reference: tests/test_semantic_exhaustiveness_governance.py
    summary: Regressões comprovam digest de snapshot, caminho canônico, revisão obrigatória, contraexemplos, evidências independentes e vínculo de status.
  - kind: test
    reference: tests/test_build_time_provenance_governance.py
    summary: Regressões preservam separação provenance/semântica, mapping partial e ausência de authority para rule-pass.
  - kind: test
    reference: tests/test_provenance_producer_trust.py
    summary: Regressões exigem reprodução exata de producers declarativo/observado, bindings autorizados e trust-only sem elevar provenance para semântica comprovada.
  - kind: test
    reference: tests/test_provenance_semantic_interpretation.py
    summary: Regressões provam somente ffi_native_linkage local a partir de linker_binding observada + trust verified e recusam candidates não autorizadas ou evidence/attestation adulterados.
  - kind: adoption
    reference: decisions/rules/MOD-001/0.2.0-experimental-approved.yaml
    summary: A adoção permanece experimental enquanto complete_rule_semantics não for provado e o mecanismo não estiver integrado ao enforcement.
assessment:
  assessor: SupportingBasesOfficial
