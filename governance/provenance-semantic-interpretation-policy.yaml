    rationale: >-
      Uma linker_binding observada materializa uma dependência de ligação entre artefatos.
      A taxonomia semântica define ffi_native_linkage como dependência por FFI, native
      linkage, extensão nativa ou mecanismo equivalente entre runtimes. A autorização
      é local à transformation e não prova cobertura/exaustividade nem outcome de regra.
