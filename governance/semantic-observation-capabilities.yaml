  - adapter_id: evolutive.ecmascript.imports
    adapter_version: 0.1.0
    adapter_implementation_sha256: "733eabb25ab917d001ac29b3fd0e06727b58e8c47bc0f26c997a3c213684a7be"
    relations:
      - relation_id: source_module_dependency
        assurance: complete_when_coverage_sufficient
        limitations:
          - A garantia cobre somente module specifiers de alta confiança aceitos pelo adapter e exige coverage sufficient.
          - JSX/TSX, aliases não resolvidos, ordinary require, reflection, FFI, IPC e wiring externo permanecem fora desta capability.
